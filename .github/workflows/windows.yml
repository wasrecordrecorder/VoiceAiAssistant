name: windows-build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test backend core
        shell: pwsh
        run: .\scripts\test-backend.ps1

      - name: Configure native app
        run: cmake --preset vs2022-x64

      - name: Build native app
        run: cmake --build --preset release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WebViewDA-Voice-windows-x64
          path: out/build/vs2022-x64/bin/Release
